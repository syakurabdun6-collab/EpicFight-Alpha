plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName.set("HumanoidCombat")
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def sourceZip = layout.projectDirectory.file("src.zip")
def extractedDir = layout.buildDirectory.dir("unpacked-src")

tasks.register("unpackSourceZip", Sync) {
    from zipTree(sourceZip)
    into extractedDir
}

sourceSets {
    main {
        java.srcDir(extractedDir.map { it.dir("src/main/java") })
        resources.srcDir(extractedDir.map { it.dir("src/main/resources") })
    }
}

tasks.named("compileJava") {
    dependsOn("unpackSourceZip")
}

tasks.named("processResources") {
    dependsOn("unpackSourceZip")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}
